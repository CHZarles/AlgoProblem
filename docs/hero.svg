<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="64" y="64" width="1072" height="502" rx="22" fill="#0F1520" stroke="rgba(148,163,184,0.18)" filter="url(#shadow)"/>

  <rect x="96" y="96" width="8" height="56" rx="4" fill="url(#accent)"/>
  <text x="120" y="132" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="700">AlgoWorkspace</text>
  <text x="120" y="160" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="16">
    Local-first algorithm workspace · URL→Markdown · Notes & Solutions · Review · Stats
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="16" fill="#CBD5E1">
    <text x="120" y="210">• Collect problems across OJ platforms (URL → Markdown)</text>
    <text x="120" y="240">• Notes & solutions as separate dimensions, searchable and reusable</text>
    <text x="120" y="270">• Spaced repetition “Today’s Review Queue” + GitHub-style heatmap</text>
    <text x="120" y="300">• Single workspace, no login, data stays on your machine</text>
  </g>

  <g>
    <rect x="120" y="336" width="960" height="196" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(148,163,184,0.16)"/>
    <rect x="144" y="362" width="912" height="26" rx="10" fill="rgba(255,255,255,0.05)"/>
    <circle cx="158" cy="375" r="5" fill="#34D399"/>
    <circle cx="176" cy="375" r="5" fill="#FBBF24"/>
    <circle cx="194" cy="375" r="5" fill="#F87171"/>
    <text x="220" y="381" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">README screenshot placeholder</text>

    <rect x="144" y="404" width="560" height="108" rx="14" fill="rgba(2,6,23,0.45)" stroke="rgba(148,163,184,0.12)"/>
    <rect x="720" y="404" width="336" height="108" rx="14" fill="rgba(2,6,23,0.28)" stroke="rgba(148,163,184,0.12)"/>
    <text x="168" y="448" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="600">Problem Bank</text>
    <text x="168" y="474" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">List · filters · tags · status</text>
    <text x="744" y="448" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="600">Heatmap</text>
    <text x="744" y="474" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Review / Publish / All</text>
  </g>

  <text x="96" y="586" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui" font-size="12">
    Replace this placeholder with real screenshots: docs/hero.png, docs/shots/*.png
  </text>
</svg>

